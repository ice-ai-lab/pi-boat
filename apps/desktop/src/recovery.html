<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PiBoat</title>
    <style>
      /* 恢复页是桌面壳自有 chrome（不属 web 设计规范基线），暗色取应用近似值 */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #16181d;
        color: #e6e8ee;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #9aa1ad;
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 8px 18px;
        margin: 0 6px;
        border-radius: 6px;
        border: 1px solid #3a3f4a;
        background: transparent;
        color: #e6e8ee;
        cursor: pointer;
      }
      button.primary {
        background: #4c8dff;
        border-color: #4c8dff;
        color: #0e1116;
        font-weight: 600;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin-top: 16px;
        font-size: 12px;
        color: #9aa1ad;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PiBoat could not reach its local server</h1>
      <p>
        The server process failed to start or did not become ready in time.
        Retry, or quit the app. (Details are in the process log.)
      </p>
      <button id="retry" class="primary" type="button">Retry</button>
      <button id="quit" type="button">Quit</button>
      <div id="status" role="status"></div>
    </main>
    <script>
      var status = document.getElementById('status');
      function setButtonsDisabled(disabled) {
        const buttons = document.querySelectorAll('button');
        for (let i = 0; i < buttons.length; i++) {
          buttons[i].disabled = disabled;
        }
      }
      document.getElementById('retry').addEventListener('click', () => {
        setButtonsDisabled(true);
        status.textContent = 'Starting the local server…';
        if (!window.piBoat) {
          status.textContent = 'Desktop bridge unavailable.';
          setButtonsDisabled(false);
          return;
        }
        window.piBoat.recover().then((recovered) => {
          if (!recovered) {
            status.textContent = 'Still failing. You can retry or quit.';
            setButtonsDisabled(false);
          }
        });
      });
      document.getElementById('quit').addEventListener('click', () => {
        window.piBoat ? window.piBoat.quit() : window.close();
      });
    </script>
  </body>
</html>
