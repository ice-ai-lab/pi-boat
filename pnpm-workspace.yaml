packages:
  - "apps/*"
  - "packages/*"
  - "packages/config/*"

# pi SDK 依赖链中需要执行 postinstall 的包（esbuild 为 tsx 运行所必需）
onlyBuiltDependencies:
  - "@google/genai"
  - esbuild
  - protobufjs
allowBuilds:
  '@google/genai': set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false
